<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réinitialiser le mot de passe — SMILE</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-page"><section class="auth-card"><h1>Nouveau mot de passe</h1><p>Choisissez un mot de passe d’au moins 10 caractères. Ce lien ne peut être utilisé qu’une seule fois et expire après 30 minutes.</p><form id="reset-form"><label>Nouveau mot de passe</label><input name="password" type="password" minlength="10" maxlength="200" required autocomplete="new-password"><button type="submit">Enregistrer</button><p id="reset-status" role="status"></p></form></section></main><script>
document.querySelector('#reset-form').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('#reset-status'),password=new FormData(e.currentTarget).get('password'),token=new URLSearchParams(location.search).get('token');try{const r=await fetch('/api/auth/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');status.textContent='Mot de passe modifié. Vous pouvez maintenant vous connecter.';e.currentTarget.reset()}catch(err){status.textContent=err.message}});
</script><script src="password-toggle.js"></script></body></html>
